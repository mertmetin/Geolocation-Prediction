[project]
name = "geoloc"
version = "2.0.0"
description = "Predicting where Canadian Twitter users live from their tweets and social graph: 2019 thesis models, fixed and compared against embeddings and LLMs."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mert Metin" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40"]
app = ["gradio>=5", "plotly>=5", "joblib"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
geoloc = "geoloc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoloc"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
